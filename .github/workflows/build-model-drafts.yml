name: Build and QA evidence-based model drafts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/build-model-drafts.request', '.github/workflows/build-model-drafts.yml', 'models-source/**', 'scripts/build-reviewed-model.py', 'scripts/qa-model-browser.py']
permissions:
  contents: read
concurrency:
  group: case-in-3d-model-draft-qa
  cancel-in-progress: true
jobs:
  models:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Read exact source commit
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install isolated browser test runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/model-venv"
          "$RUNNER_TEMP/model-venv/bin/pip" install playwright==1.57.0
          "$RUNNER_TEMP/model-venv/bin/python" -m playwright install --with-deps chromium
      - name: Build drafts and exercise each exact HTML offline
        run: |
          "$RUNNER_TEMP/model-venv/bin/python" - <<'PY'
          import importlib.util,json,os,subprocess
          from pathlib import Path
          root=Path.cwd();out=Path(os.environ['RUNNER_TEMP'])/'model-drafts';out.mkdir()
          spec=importlib.util.spec_from_file_location('builder',root/'scripts/build-reviewed-model.py');builder=importlib.util.module_from_spec(spec);spec.loader.exec_module(builder)
          results=[]
          for source in sorted((root/'models-source').glob('*.json')):
              data=json.loads(source.read_text());html=out/(data['id']+'.html')
              result=builder.build(source,html,root/'out/modelli/via-gianelli-7.html')
              test=subprocess.run([os.environ['RUNNER_TEMP']+'/model-venv/bin/python','scripts/qa-model-browser.py',str(html),'--out',str(out/data['id']),'--views',str(result['viewCount'])])
              result['browserPassed']=test.returncode==0;results.append(result)
          (out/'build-results.json').write_text(json.dumps(results,indent=2)+'\n')
          if any(not r['browserPassed'] for r in results):raise SystemExit(1)
          PY
      - name: Export exact drafts and test evidence for visual review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-drafts-and-qa
          path: ${{ runner.temp }}/model-drafts
          retention-days: 3
          if-no-files-found: warn
